# Short before/after throughput benchmark for the Triton RMSNorm kernel, at
# base.yaml's real model scale (not gpu_smoke.yaml's tiny synthetic dims --
# kernel launch overhead would dominate at that scale and wouldn't reflect a
# real speedup). Not a real training run -- just measures tok/s and MFU.
seed: 1337
compile: true

model:
  vocab_size: 16384
  n_layer: 8
  n_head: 12
  n_embd: 768
  block_size: 1024
  dropout: 0.0
  bias: false
  use_triton_rmsnorm: false

train_bin: data/tokenized/train.bin
val_bin: data/tokenized/val.bin
checkpoint_path: checkpoints/triton_bench_off.pt

lr: 6.0e-4
min_lr: 6.0e-5
weight_decay: 0.1
betas: [0.9, 0.95]
warmup_steps: 20
max_steps: 200
grad_clip: 1.0

micro_batch_size: 32
grad_accum_steps: 4

log_interval: 20
checkpoint_interval: 1000
