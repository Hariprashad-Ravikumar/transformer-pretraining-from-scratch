# Real-GPU smoke test: tiny model, real bf16/torch.compile path, synthetic data.
# Not a real training run, just validates the CUDA + compile + checkpoint path on hardware.
seed: 1337
compile: true

model:
  vocab_size: 512
  n_layer: 4
  n_head: 4
  n_embd: 128
  block_size: 256
  dropout: 0.0
  bias: false

train_bin: data/tiny/train.bin
val_bin: data/tiny/val.bin
checkpoint_path: checkpoints/gpu_smoke.pt

lr: 3.0e-4
min_lr: 3.0e-5
weight_decay: 0.1
betas: [0.9, 0.95]
warmup_steps: 5
max_steps: 50
grad_clip: 1.0

micro_batch_size: 16
grad_accum_steps: 2

log_interval: 10
checkpoint_interval: 25
